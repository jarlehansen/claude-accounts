name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test (with race detector)
        run: |
          go test -race -v ./... | tee test-output.log
          pass=$(grep -c '^--- PASS:' test-output.log || true)
          fail=$(grep -c '^--- FAIL:' test-output.log || true)
          skip=$(grep -c '^--- SKIP:' test-output.log || true)
          total=$((pass + fail + skip))
          summary="Tests: $total total, $pass passed, $fail failed, $skip skipped"
          echo "$summary"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
